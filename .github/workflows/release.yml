name: Publish Skill release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      release-tag: ${{ github.ref_name }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pflow-release
          path: release
      - name: Verify package checksum
        working-directory: release
        run: sha256sum -c pflow.zip.sha256
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/pflow.zip release/pflow.zip.sha256 --verify-tag --generate-notes --title "pFlow $RELEASE_TAG"
